<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff4ff,#fff7dc);font-family:Tahoma,Arial,sans-serif;color:#17324d;min-height:100vh;display:grid;place-items:center}.frame{width:min(100vw,177.78vh);aspect-ratio:16/9;padding:1.3%;display:flex;flex-direction:column}.head{display:flex;align-items:center;justify-content:space-between;height:10%;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{background:#fff;border-radius:16px;padding:10px;font-size:2.2vw;box-shadow:0 5px 16px #4684a833}.brand small{font-weight:700;color:#42738e}.brand h1{margin:0;font-size:2.25vw}.score{background:#fff;padding:.7vw 1.3vw;border-radius:99px;font-size:1.2vw;font-weight:800}.progress{height:1.2%;border-radius:99px;background:#fff;margin:.4% 0 .7%;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#2bbf7b,#ffcb45);width:0;transition:.3s}.card{height:83%;background:#fffffff2;border:4px solid #fff;border-radius:2.3vw;box-shadow:0 1.5vw 4vw #27709e33;padding:2.5%;display:grid;place-items:center;position:relative;overflow:hidden}.cover{width:100%;display:grid;grid-template-columns:.35fr 1.3fr .45fr;gap:2%;align-items:center}.students{display:flex;align-items:flex-end;justify-content:center;height:100%;position:relative}.students img{position:absolute;bottom:-2.5vw;width:10vw;max-width:150px;height:27vw;max-height:410px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 .7vw .6vw #31566c2b)}.students img:last-child{width:8vw;transform:translateX(4.2vw);opacity:.98}.students img:first-child{transform:translateX(-2.7vw)}.intro{text-align:center}.icons{font-size:3vw;letter-spacing:.6vw}.pill{display:inline-block;background:#e1f5ec;color:#118153;border-radius:99px;padding:.5vw 1.2vw;font-weight:800}.intro h2{font-size:3.7vw;line-height:1.18;margin:1vw 0 .6vw}.intro p{font-size:1.35vw;color:#52708a;margin:0 0 1.4vw}.primary{border:0;border-radius:1.2vw;color:#fff;background:linear-gradient(#2698f4,#0d72ce);box-shadow:0 .55vw 0 #0757a1;padding:1vw 2vw;font-size:1.55vw;font-weight:900;cursor:pointer}.teacher{text-align:center;background:#e9f8ff;border:3px solid #c2e6f8;border-radius:2vw;padding:.8vw}.teacher img{height:15vw;max-height:230px;width:100%;object-fit:contain;display:block}.teacher h3{font-size:1.1vw;margin:.25vw 0}.teacher p{font-size:.75vw;margin:.12vw 0;color:#45667e;font-weight:700}.activity{width:100%}.stage-head{display:flex;align-items:center;gap:1vw}.num{display:grid;place-items:center;width:4vw;height:4vw;border-radius:1.2vw;color:#fff;background:#1684e8;box-shadow:0 .4vw 0 #0965bd;font-size:2vw;font-weight:900}.stage-head small{font-size:1vw}.stage-head h2{font-size:2.2vw;margin:0}.count{display:inline-block;background:#edf7ff;border-radius:99px;padding:.4vw 1vw;margin-top:1.4vw;font-weight:800}.question{font-size:2.25vw;margin:1.2vw 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw}.choice,.step{min-height:6vw;border:3px solid #cde6f8;border-radius:1.3vw;background:#f8fcff;box-shadow:0 .4vw 0 #cde6f8;font-size:1.35vw;font-weight:800;cursor:pointer;padding:1vw}.choice:hover,.step:hover{background:#eef9ff;border-color:#69baf2}.choice.wrong{background:#fff0f0;border-color:#f28686}.answer{display:grid;grid-template-columns:repeat(5,1fr);gap:.6vw;margin:1.2vw 0}.slot{min-height:5.4vw;border:2px dashed #9d8cdb;background:#f3efff;border-radius:1vw;display:grid;place-items:center;text-align:center;font-size:.9vw;font-weight:800;padding:.4vw}.slot b{font-size:1.4vw}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:.7vw}.step{min-height:6.5vw;font-size:1vw}.step span{display:block;font-size:2vw}.step:disabled{opacity:.3}.sequence{padding:1.5vw;background:#fff8e6;border:3px solid #f6d98b;border-radius:1.3vw;text-align:center;font-size:1.35vw;font-weight:800;margin:1.3vw 0}.feedback{position:absolute;bottom:1vw;left:50%;transform:translateX(-50%);background:#ffe9e9;border-radius:1vw;padding:.7vw 2vw;font-size:1.15vw;font-weight:900}.feedback.good{background:#e1f7ec;color:#116b47}.done{text-align:center}.done .trophy{font-size:6vw}.done h2{font-size:4vw;margin:.3vw}.done p{font-size:1.4vw}.final{background:#fff5ce;border-radius:1vw;padding:.8vw 1.5vw;font-size:1.4vw;margin:1vw}.virtues{font-weight:800;font-size:1.1vw;margin:1vw}.hidden{display:none!important}@media(max-aspect-ratio:4/3){.frame{width:100vw;height:auto;min-height:100vh;aspect-ratio:auto}.card{min-height:82vh}.cover{grid-template-columns:1fr}.students{display:none}.teacher{display:flex;align-items:center;justify-content:center;gap:12px}.teacher img{height:180px;width:120px}.teacher h3{font-size:16px}.teacher p{font-size:12px}.brand h1{font-size:24px}.score,.intro p,.choice,.question,.stage-head h2{font-size:18px}.intro h2{font-size:36px}.primary{font-size:20px}.choices{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}
</style>

let score=0,q=0,picked=[],timer;
const card=document.getElementById("card"),scoreEl=document.getElementById("score"),progress=document.getElementById("progress"),bar=document.getElementById("bar");
function shell(show=true){scoreEl.classList.toggle("hidden",!show);progress.classList.toggle("hidden",!show);scoreEl.textContent=`⭐ ${score} คะแนน`}
function feedback(text,good=false){document.querySelector(".feedback")?.remove();let x=document.createElement("div");x.className="feedback"+(good?" good":"");x.textContent=text;card.appendChild(x)}
function cover(){shell(false);card.innerHTML=`<div class="cover"><div class="students" aria-label="นักเรียนสหกรณ์"><img src="${STUDENT1}" alt="นักเรียนสหกรณ์"><img src="${STUDENT2}" alt="นักเรียนสหกรณ์ไหว้"></div><section class="intro"><div class="icons">📚 ✏️ 🥛 🍪</div><span class="pill">ภารกิจ 3 ด่าน</span><h2>มาฝึกซื้อของ<br>อย่างเป็นขั้นตอนกันเถอะ!</h2><p>อ่านโจทย์ เลือกคำตอบ และเรียงขั้นตอนให้ถูกต้อง</p><button class="primary" onclick="start()">เริ่มเล่นเกม ▶</button></section><aside class="teacher"><img src="${IMG}" alt="นางสาววิภาพร ป้อมกระโทก"><div><small>ครูผู้สอน</small><h3>นางสาววิภาพร ป้อมกระโทก</h3><p>ตำแหน่งครู วิทยฐานะครูชำนาญการ</p><p>โรงเรียนวัดเกาะสุวรรณาราม</p><p>สำนักงานเขตสายไหม กรุงเทพมหานคร</p></div></aside></div>`}
function start(){score=0;q=0;picked=[];quizPage()}
function quizPage(){shell();bar.style.width=(8+q*8)+"%";let x=quiz[q];card.innerHTML=`<section class="activity"><div class="stage-head"><div class="num">1</div><div><small>ด่านที่ 1</small><h2>เลือกขั้นตอนที่ถูกต้อง</h2></div></div><div class="count">ข้อ ${q+1} จาก 4</div><h3 class="question">${x[0]}</h3><div class="choices">${x[1].map(v=>`<button class="choice" onclick="answer(this,'${v}')">${v}</button>`).join("")}</div></section>`}
function answer(btn,v){if(v!==quiz[q][2]){btn.classList.add("wrong");feedback("ยังไม่ถูกนะ ลองคิดอีกครั้ง 😊");return}score++;shell();feedback("เก่งมาก! ถูกต้อง 🎉",true);clearTimeout(timer);timer=setTimeout(()=>{q++;q<4?quizPage():orderPage()},600)}
function orderPage(){bar.style.width=(40+picked.length*9)+"%";let order=[steps[2],steps[0],steps[4],steps[1],steps[3]];card.innerHTML=`<section class="activity"><div class="stage-head"><div class="num" style="background:#8065da">2</div><div><small>ด่านที่ 2</small><h2>เรียงขั้นตอนให้ถูกต้อง</h2></div></div><p>กดเลือกทีละข้อ ตั้งแต่ขั้นตอนแรกจนถึงขั้นตอนสุดท้าย</p><div class="answer">${steps.map((s,i)=>`<div class="slot">${picked[i]?`${steps[i][2]}<br>${steps[i][1]}`:`<b>${i+1}</b>`}</div>`).join("")}</div><div class="steps">${order.map(s=>`<button class="step" ${picked.includes(s[0])?"disabled":""} onclick="pick('${s[0]}')"><span>${s[2]}</span>${s[1]}</button>`).join("")}</div></section>`}
function pick(id){if(id!==steps[picked.length][0]){feedback("ลำดับยังไม่ถูก ลองเลือกใหม่อีกครั้ง");return}picked.push(id);score++;shell();if(picked.length===5){bar.style.width="85%";feedback("ถูกต้อง ไปต่อเลย!",true);setTimeout(errorPage,650)}else orderPage()}
function errorPage(){bar.style.width="90%";card.innerHTML=`<section class="activity"><div class="stage-head"><div class="num" style="background:#f19738">3</div><div><small>ด่านที่ 3</small><h2>จับผิดลำดับขั้นตอน</h2></div></div><h3 class="question">ส่วนใดเรียงลำดับผิด?</h3><div class="sequence">เตรียมเงิน → เลือกสินค้า → ชำระเงิน → ตรวจสอบราคา → รับสินค้า</div><div class="choices">${["เตรียมเงิน → เลือกสินค้า","เลือกสินค้า → ชำระเงิน","ชำระเงิน → ตรวจสอบราคา"].map(v=>`<button class="choice" onclick="finish(this,'${v}')">${v}</button>`).join("")}</div></section>`}
function finish(btn,v){if(v!=="ชำระเงิน → ตรวจสอบราคา"){btn.classList.add("wrong");feedback("ลองดูใหม่ว่า ขั้นตอนไหนสลับที่กัน");return}score++;shell();bar.style.width="100%";setTimeout(done,500)}
function done(){card.innerHTML=`<section class="done"><div class="trophy">🏆</div><span class="pill">สำเร็จครบทุกภารกิจ</span><h2>ยอดเยี่ยมมาก!</h2><p>หนูรู้จักการซื้อของอย่างเป็นขั้นตอนแล้ว</p><div class="final">⭐ คะแนนสะสม <b>${score} / 10</b></div><div class="virtues">🤝 มีวินัย　💛 ซื่อสัตย์　🌱 ประหยัด</div><button class="primary" onclick="start()">เล่นอีกครั้ง ↻</button></section>`}
cover();
</script>
</body>
</html>
